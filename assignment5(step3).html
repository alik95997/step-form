<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

<body>
    <div class="signupinfo">
    <h1>Sign Up</h1>
    <p>Please provide all required details to register your business with us</p>
        <div class="btn-grp">
            <a href="./assignment5(step1).html"><button>Step 1</button></a> 
            <a href="./assignment5(step2).html"><button>Step 2 </button></a> 
            <a href="./assignment5(step3).html"><button style="background-color: red;">Step 3</button></a>
    </div>

</div>

    <fieldset class="container">
        <legend>Register Your Business</legend>
        
        <form action="" class="">
            <div class="business-owner">
                <h2>Business Details</h2>
                <label for="fName"> Type of Business:</label>
                <select name="" id="">
                    <option value="" disabled selected>Select Type of Business</option>
                    <option value="">Partnership</option>
                    <option value="">Corporation</option>
                    <option value="">Kommanditgesellschaft</option>
                    <option value="">Cooperative</option>
                    <option value="">Manufacturing business</option>
                    <option value="">Large businesses</option>
                    <option value="">Sole proprietorship</option>
                    <option value="">S corporation</option>
                </select>
            </div>

            <div class="business-name">
                <label for="">Business Name :</label>
                <input type="text">
            </div>

            <div class="contact-name">
                <span>Select Business Net Worth :</span>
                <label for="">10k Dollar</label>
                <input type="checkbox">
                <label for="">15k Dollar</label>
                <input type="checkbox">
                <label for="">20k Dollar</label>
                <input type="checkbox">
            </div>

            <div class="email">
                <label for=""> Message :</label>
                <textarea name="" id="" rows="5" cols="50"></textarea>
            </div>
            <div>
                <button><a href="./assignment5(step2).html">Prev</a></button>
                <button type="submit"><a href="">Submit</a></button>
            </div>
        </form>
    </fieldset>
</body>

</html>
